<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Palacio Nacional - Simulador Presidencial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f5f5f5;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.03) 0px,
                    transparent 1px,
                    transparent 2px,
                    rgba(255, 255, 255, 0.03) 3px
                );
            pointer-events: none;
            opacity: 0.3;
        }

        .container {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            width: 90%;
            padding: 2rem;
        }

        .emblem {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #c9a961 0%, #8b6f47 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 0 3px rgba(201, 169, 97, 0.3),
                0 10px 40px rgba(0, 0, 0, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        .emblem::before {
            content: '⚖';
            font-size: 3.5rem;
            color: #2d1810;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            color: #c9a961;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            line-height: 1.2;
        }

        .subtitle {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: #a0a0a0;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .beta-badge {
            display: inline-block;
            background: rgba(201, 169, 97, 0.2);
            border: 1px solid #c9a961;
            color: #c9a961;
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            font-weight: 600;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .menu-button {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.1) 0%, rgba(139, 111, 71, 0.1) 100%);
            border: 2px solid rgba(201, 169, 97, 0.4);
            color: #f5f5f5;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-family: 'Georgia', serif;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            font-weight: 500;
        }

        .menu-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 169, 97, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .menu-button:hover:not(:disabled)::before {
            left: 100%;
        }

        .menu-button:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(201, 169, 97, 0.25) 0%, rgba(139, 111, 71, 0.25) 100%);
            border-color: #c9a961;
            box-shadow: 0 0 20px rgba(201, 169, 97, 0.3);
            transform: translateY(-2px);
        }

        .menu-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .menu-button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(201, 169, 97, 0.2);
        }

        .menu-button .icon {
            margin-right: 0.8rem;
            font-style: normal;
        }

        footer {
            position: absolute;
            bottom: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            width: 100%;
        }

        footer a {
            color: #c9a961;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #e5c97f;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem;
            }

            .emblem {
                width: 90px;
                height: 90px;
                margin-bottom: 1.5rem;
            }

            .emblem::before {
                font-size: 2.5rem;
            }

            .menu-button {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }

            .beta-badge {
                margin-bottom: 2rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container > * {
            animation: fadeIn 0.8s ease-out forwards;
            opacity: 0;
        }

        .emblem { animation-delay: 0.1s; }
        h1 { animation-delay: 0.2s; }
        .subtitle { animation-delay: 0.3s; }
        .beta-badge { animation-delay: 0.4s; }
        .menu { animation-delay: 0.5s; }

        .particle {
            position: absolute;
            background: rgba(201, 169, 97, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 15s infinite;
        }

        @keyframes rise {
            0% {
                bottom: -10%;
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                bottom: 110%;
                opacity: 0;
            }
        }

        /* Fade out al cambiar de página */
        body.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="particle" style="left: 10%; width: 4px; height: 4px; animation-delay: 0s;"></div>
    <div class="particle" style="left: 30%; width: 3px; height: 3px; animation-delay: 5s;"></div>
    <div class="particle" style="left: 50%; width: 5px; height: 5px; animation-delay: 10s;"></div>
    <div class="particle" style="left: 70%; width: 4px; height: 4px; animation-delay: 3s;"></div>
    <div class="particle" style="left: 90%; width: 3px; height: 3px; animation-delay: 8s;"></div>

    <div class="container">
        <div class="emblem"></div>
        
        <h1>El Palacio<br>Nacional</h1>
        <p class="subtitle">Simulador Presidencial</p>
        
        <div class="beta-badge">Beta</div>

        <nav class="menu">
            <button class="menu-button" id="btnIniciar">
                <span class="icon">▶</span> Iniciar Partida
            </button>
            <button class="menu-button" id="btnCargar" disabled>
                <span class="icon">💾</span> Cargar Partida
            </button>
            <button class="menu-button" id="btnGuia">
                <span class="icon">📖</span> Tutorial
            </button>
        </nav>
    </div>

    <footer>
        <p>Proyecto Educativo | © 2025</p>
    </footer>

    <script>
        const buttons = document.querySelectorAll('.menu-button:not(:disabled)');
        
        buttons.forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.letterSpacing = '0.15em';
            });
            
            button.addEventListener('mouseleave', () => {
                button.style.letterSpacing = '0.1em';
            });
        });

        // Navegar a intro.html con transición
        document.getElementById('btnIniciar').addEventListener('click', () => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'intro.html';
            }, 500);
        });

        document.getElementById('btnGuia').addEventListener('click', () => {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'tutorial.html';
            }, 500);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('btnIniciar').click();
            }
        });

        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = (Math.random() * 3 + 2) + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            document.body.appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 25000);
        }

        setInterval(createParticle, 3000);
    </script>
</body>
</html>
