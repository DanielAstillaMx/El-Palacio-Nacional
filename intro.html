<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Palacio Nacional - Introducción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cambria', 'Garamond', 'Georgia', serif;
            background: #0a0a0a;
            overflow: hidden;
            height: 100vh;
            perspective: 600px;
            position: relative;
        }

        /* Fondo con llamas animadas */
        .flame-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 25%, #1a0f0a 50%, #2d1810 75%, #1a0f0a 100%);
            background-size: 400% 400%;
            animation: backgroundShift 8s ease infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Efecto de llamas */
        .flame-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }

        .flame {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 200px;
            background: radial-gradient(ellipse at center, rgba(255, 100, 20, 0.8) 0%, rgba(255, 50, 0, 0.4) 50%, transparent 70%);
            filter: blur(15px);
            animation: flicker 3s ease-in-out infinite;
        }

        .flame:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .flame:nth-child(2) {
            left: 30%;
            animation-delay: 0.5s;
            height: 180px;
        }

        .flame:nth-child(3) {
            left: 50%;
            animation-delay: 1s;
            height: 220px;
        }

        .flame:nth-child(4) {
            left: 70%;
            animation-delay: 0.7s;
            height: 190px;
        }

        .flame:nth-child(5) {
            left: 85%;
            animation-delay: 0.3s;
            height: 210px;
        }

        @keyframes flicker {
            0%, 100% {
                transform: translateY(0) scaleX(1);
                opacity: 0.4;
            }
            25% {
                transform: translateY(-20px) scaleX(0.9);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-10px) scaleX(1.1);
                opacity: 0.5;
            }
            75% {
                transform: translateY(-30px) scaleX(0.95);
                opacity: 0.65;
            }
        }

        /* Contenedor del texto */
        .intro-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 1000px;
            text-align: center;
            z-index: 10;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Primera frase - VIVA LA PATRIA */
        .intro-text-first {
            color: #d4a574;
            font-size: clamp(1.4rem, 3.5vw, 2.1rem);
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.15em;
            text-shadow: 
                3px 3px 10px rgba(0, 0, 0, 0.9),
                0 0 30px rgba(212, 165, 116, 0.4),
                0 0 60px rgba(139, 90, 43, 0.2);
            font-style: italic;
            margin-bottom: 3rem;
            opacity: 0;
            animation: 
                fadeInText 1.5s ease-out 0.5s forwards,
                holdText 6s ease-out 2s forwards,
                fadeOutText 1.5s ease-in 8s forwards;
            position: absolute;
        }

        /* Segunda frase - MUERA EL MAL GOBIERNO */
        .intro-text-second {
            color: #d4a574;
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            font-weight: 400;
            line-height: 2;
            letter-spacing: 0.18em;
            text-shadow: 
                3px 3px 15px rgba(0, 0, 0, 0.95),
                0 0 50px rgba(220, 80, 80, 0.9),
                0 0 100px rgba(180, 20, 20, 0.6);
            font-style: italic;
            text-transform: uppercase;
            opacity: 0;
            animation: 
                fadeInTextRed 1.5s ease-out 8.5s forwards,
                holdTextRed 6s ease-out 10s forwards,
                fadeOutText 1.5s ease-in 16s forwards;
            position: absolute;
        }

        /* Tercera frase - GRITO DE DOLORES */
        .intro-text-third {
            color: #c9a961;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 300;
            line-height: 2;
            letter-spacing: 0.15em;
            text-shadow: 
                3px 3px 10px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(201, 169, 97, 0.3),
                0 0 40px rgba(139, 90, 43, 0.15);
            font-style: italic;
            opacity: 0;
            animation: 
                fadeInText 1.5s ease-out 16.5s forwards,
                holdText 2.5s ease-out 18s forwards,
                fadeOutText 1s ease-in 20.5s forwards;
            position: absolute;
        }

        /* Animaciones */
        @keyframes fadeInText {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes fadeInTextRed {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(20px);
                text-shadow: 
                    3px 3px 15px rgba(0, 0, 0, 0.95),
                    0 0 20px rgba(220, 80, 80, 0.3),
                    0 0 40px rgba(180, 20, 20, 0.1);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                text-shadow: 
                    3px 3px 15px rgba(0, 0, 0, 0.95),
                    0 0 50px rgba(220, 80, 80, 0.9),
                    0 0 100px rgba(180, 20, 20, 0.6);
            }
        }

        @keyframes holdText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes holdTextRed {
            0% {
                opacity: 1;
                text-shadow: 
                    3px 3px 15px rgba(0, 0, 0, 0.95),
                    0 0 50px rgba(220, 80, 80, 0.9),
                    0 0 100px rgba(180, 20, 20, 0.6);
            }
            100% {
                opacity: 1;
                text-shadow: 
                    3px 3px 15px rgba(0, 0, 0, 0.95),
                    0 0 50px rgba(220, 80, 80, 0.9),
                    0 0 100px rgba(180, 20, 20, 0.6);
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* Fade in inicial */
        body {
            animation: fadeInBody 1.5s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Fade out al terminar */
        body.fade-out {
            animation: fadeOut 2s ease-out forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; }
        }

        /* Barra de progreso */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: linear-gradient(90deg, #8b5a2b, #d4a574, #8b5a2b);
            width: 0%;
            animation: progress 23s linear forwards;
            z-index: 100;
            box-shadow: 0 0 8px rgba(212, 165, 116, 0.5);
        }

        @keyframes progress {
            to { width: 100%; }
        }

        /* Botón de saltar */
        .skip-button {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            background: rgba(139, 90, 43, 0.15);
            border: 1.5px solid rgba(212, 165, 116, 0.5);
            color: #d4a574;
            padding: 0.9rem 1.8rem;
            font-family: 'Cambria', serif;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 100;
            animation: fadeInButton 1s ease-in 21s forwards;
            font-weight: 300;
        }

        @keyframes fadeInButton {
            to { opacity: 1; }
        }

        .skip-button:hover {
            background: rgba(139, 90, 43, 0.3);
            border-color: #d4a574;
            box-shadow: 
                0 0 15px rgba(212, 165, 116, 0.4),
                inset 0 0 15px rgba(212, 165, 116, 0.1);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .intro-text-first {
                font-size: 1.1rem;
            }

            .intro-text-second {
                font-size: 1.2rem;
            }

            .skip-button {
                bottom: 1.5rem;
                right: 1.5rem;
                padding: 0.7rem 1.4rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="flame-background"></div>
    
    <div class="flame-container">
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
        <div class="flame"></div>
    </div>

    <div class="progress-bar"></div>

    <div class="intro-container">
        <p class="intro-text-first">¡Viva la patria y reine por siempre en este continente americano nuestra sagrada patrona la santísima Virgen de Guadalupe!</p>

        <p class="intro-text-second">¡Muera el mal gobierno!</p>

        <p class="intro-text-third">— Grito de Dolores —</p>
    </div>

    <button class="skip-button" id="skipBtn">
        Saltar Introducción
    </button>

    <script>
        const INTRO_DURATION = 23000;

        setTimeout(() => {
            fadeOutAndRedirect();
        }, INTRO_DURATION);

        document.getElementById('skipBtn').addEventListener('click', () => {
            fadeOutAndRedirect();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                fadeOutAndRedirect();
            }
        });

        function fadeOutAndRedirect() {
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'game.html';
            }, 2000);
        }
    </script>
</body>
</html>
